<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenericAgent — VRM Avatar Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; }

#canvas-container { width: 100%; height: calc(100vh - 60px); position: relative; }
canvas { width: 100%; height: 100%; display: block; }

#controls {
  height: 60px; background: #16213e; border-top: 1px solid #0f3460;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
}

.btn {
  background: #0f3460; color: #e94560; border: 1px solid #e94560;
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  transition: all 0.2s;
}
.btn:hover { background: #e94560; color: #fff; }
.btn.active { background: #e94560; color: #fff; }

#status { color: #888; font-size: 12px; margin-left: auto; }
#avatar-name { color: #e94560; font-weight: 600; font-size: 14px; }

#drop-overlay {
  display: none; position: fixed; inset: 0; background: rgba(233,69,96,0.3);
  border: 3px dashed #e94560; z-index: 100; pointer-events: none;
  justify-content: center; align-items: center; font-size: 24px; color: #fff;
}
#drop-overlay.show { display: flex; }

#expression-panel {
  position: absolute; top: 10px; right: 10px; background: rgba(22,33,62,0.9);
  border-radius: 8px; padding: 10px; display: none; max-height: 80%; overflow-y: auto;
}
#expression-panel button {
  display: block; width: 100%; text-align: left; padding: 4px 8px;
  margin: 2px 0; background: none; border: none; color: #eee; cursor: pointer;
  border-radius: 4px; font-size: 12px;
}
#expression-panel button:hover { background: #0f3460; }

#chat-panel {
  position: absolute; bottom: 70px; left: 10px; width: 350px;
  background: rgba(22,33,62,0.95); border-radius: 8px; padding: 10px;
  display: flex; flex-direction: column; gap: 8px; max-height: 300px;
}
#chat-messages {
  flex: 1; overflow-y: auto; font-size: 13px; max-height: 200px;
}
#chat-messages .msg { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
#chat-messages .user { background: #0f3460; text-align: right; }
#chat-messages .agent { background: #1a1a2e; }

#chat-input-row { display: flex; gap: 6px; }
#chat-input {
  flex: 1; background: #1a1a2e; border: 1px solid #0f3460; color: #eee;
  padding: 6px 10px; border-radius: 4px; font-size: 13px;
}
#chat-input:focus { outline: none; border-color: #e94560; }

#ws-status { font-size: 10px; color: #555; }
#ws-status.connected { color: #4CAF50; }
</style>
</head>
<body>

<div id="drop-overlay">Drop VRM file here</div>

<div id="canvas-container">
  <canvas id="avatar-canvas"></canvas>

  <div id="expression-panel">
    <button onclick="setExpression('neutral')">neutral</button>
    <button onclick="setExpression('happy')">happy</button>
    <button onclick="setExpression('angry')">angry</button>
    <button onclick="setExpression('sad')">sad</button>
    <button onclick="setExpression('surprised')">surprised</button>
    <button onclick="setExpression('relaxed')">relaxed</button>
    <button onclick="setExpression('thinking')">thinking</button>
  </div>

  <div id="chat-panel">
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn" onclick="sendChat()">Send</button>
    </div>
    <span id="ws-status">Disconnected</span>
  </div>
</div>

<div id="controls">
  <span id="avatar-name">No avatar loaded</span>
  <button class="btn" onclick="document.getElementById('vrm-file').click()">Load VRM</button>
  <button class="btn" onclick="toggleExpressions()">Expressions</button>
  <button class="btn" onclick="loadFromVRoidHub()">VRoid Hub</button>
  <input type="file" id="vrm-file" accept=".vrm" style="display:none" onchange="loadVRMFromFile(this)">
  <span id="status">Drop a .vrm file or click Load VRM</span>
</div>

<!-- Three.js + VRM -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ═══════════════════════════════════════════════════════════════
//  Scene Setup
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('avatar-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight - 60);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / (window.innerHeight - 60), 0.1, 100);
camera.position.set(0, 1.3, 2.5);
camera.lookAt(0, 1, 0);

// Lights
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(1, 2, 1);
scene.add(dirLight);
const ambLight = new THREE.AmbientLight(0x8888ff, 0.4);
scene.add(ambLight);
const hemiLight = new THREE.HemisphereLight(0x8888ff, 0x444444, 0.6);
scene.add(hemiLight);

// Grid
const grid = new THREE.GridHelper(10, 20, 0x0f3460, 0x0a0a1e);
scene.add(grid);

// ═══════════════════════════════════════════════════════════════
//  VRM Loading
// ═══════════════════════════════════════════════════════════════

let currentVRM = null;
let currentMixer = null;
const clock = new THREE.Clock();
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));

// Expression map (GenericAgent name -> VRM BlendShape name)
const EXPRESSION_MAP = {
  happy: 'Joy', angry: 'Angry', sad: 'Sorrow',
  surprised: 'Surprised', relaxed: 'Relaxed',
  thinking: 'Neutral', neutral: 'Neutral',
  blink: 'Blink', blink_L: 'Blink_L', blink_R: 'Blink_R',
};

// Viseme map
const VISEME_MAP = { aa: 'A', ih: 'I', ou: 'U', ee: 'E', oh: 'O' };

// Blink
let blinkTimer = 0;
let isBlinking = false;

function loadVRM(url) {
  loader.load(url, (gltf) => {
    const vrm = gltf.userData.vrm;
    if (!vrm) { console.error('No VRM data found'); return; }

    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.removeUnnecessaryJoints(gltf.scene);

    // Remove old avatar
    if (currentVRM) {
      scene.remove(currentVRM.scene);
    }
    currentVRM = vrm;
    scene.add(vrm.scene);

    // Center the avatar
    const box = new THREE.Box3().setFromObject(vrm.scene);
    const center = box.getCenter(new THREE.Vector3());
    vrm.scene.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));

    // Rotate to face camera (VRM default is +Z forward)
    vrm.scene.rotation.y = Math.PI;

    const name = url.split('/').pop().replace('.vrm', '') || 'Avatar';
    document.getElementById('avatar-name').textContent = name;
    document.getElementById('status').textContent = `Loaded: ${name}`;

    console.log('VRM loaded:', name);
  }, undefined, (error) => {
    console.error('VRM load error:', error);
    document.getElementById('status').textContent = 'Error loading VRM';
  });
}

// File input
window.loadVRMFromFile = function(input) {
  const file = input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  loadVRM(url);
};

// Drag & Drop
document.addEventListener('dragover', (e) => { e.preventDefault(); document.getElementById('drop-overlay').classList.add('show'); });
document.addEventListener('dragleave', (e) => { e.preventDefault(); document.getElementById('drop-overlay').classList.remove('show'); });
document.addEventListener('drop', (e) => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.remove('show');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.vrm')) {
    const url = URL.createObjectURL(file);
    loadVRM(url);
  }
});

// ═══════════════════════════════════════════════════════════════
//  Expression Control
// ═══════════════════════════════════════════════════════════════

window.setExpression = function(name) {
  if (!currentVRM) return;
  const blendShapeName = EXPRESSION_MAP[name] || name;
  try {
    // Reset all expressions
    const expressions = currentVRM.expressionManager.expressions;
    for (const expr of expressions) {
      currentVRM.expressionManager.setValue(expr.name, 0);
    }
    // Set the target expression
    currentVRM.expressionManager.setValue(blendShapeName, 1.0);
    currentVRM.expressionManager.update();
    document.getElementById('status').textContent = `Expression: ${name}`;
  } catch (e) {
    console.warn('Expression error:', e);
  }
};

window.setVisemes = function(visemeData) {
  if (!currentVRM) return;
  try {
    // Reset visemes
    for (const key of Object.values(VISEME_MAP)) {
      currentVRM.expressionManager.setValue(key, 0);
    }
    // Set viseme values
    for (const [key, value] of Object.entries(visemeData)) {
      const vrmName = VISEME_MAP[key];
      if (vrmName) {
        currentVRM.expressionManager.setValue(vrmName, Math.max(0, Math.min(1, value)));
      }
    }
    currentVRM.expressionManager.update();
  } catch (e) {
    console.warn('Viseme error:', e);
  }
};

// ═══════════════════════════════════════════════════════════════
//  Idle Animation & Blink (AIAvatarKit-style)
// ═══════════════════════════════════════════════════════════════

function updateIdle(deltaTime) {
  if (!currentVRM) return;

  // Breathing
  const t = clock.elapsedTime;
  const breathe = Math.sin(t * 1.5) * 0.003;
  currentVRM.scene.position.y += breathe;

  // Auto-blink
  blinkTimer += deltaTime;
  if (!isBlinking && blinkTimer > 3 + Math.random() * 4) {
    isBlinking = true;
    blinkTimer = 0;
    try {
      currentVRM.expressionManager.setValue('Blink_L', 1);
      currentVRM.expressionManager.setValue('Blink_R', 1);
      currentVRM.expressionManager.update();
    } catch(e) {}
    setTimeout(() => {
      try {
        currentVRM.expressionManager.setValue('Blink_L', 0);
        currentVRM.expressionManager.setValue('Blink_R', 0);
        currentVRM.expressionManager.update();
      } catch(e) {}
      isBlinking = false;
    }, 150);
  }
}

// ═══════════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════════

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (currentVRM) {
    currentVRM.update(delta);
    updateIdle(delta);
  }

  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / (window.innerHeight - 60);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight - 60);
});

// ═══════════════════════════════════════════════════════════════
//  WebSocket Connection (to GenericAgent Python server)
// ═══════════════════════════════════════════════════════════════

let ws = null;
const wsStatus = document.getElementById('ws-status');

function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${location.hostname}:8765/ws/avatar`;
  ws = new WebSocket(wsUrl);

  ws.onopen = () => { wsStatus.textContent = 'Connected'; wsStatus.className = 'connected'; };
  ws.onclose = () => { wsStatus.textContent = 'Disconnected'; wsStatus.className = ''; setTimeout(connectWS, 3000); };
  ws.onerror = () => { wsStatus.textContent = 'Error'; };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === 'expression') window.setExpression(msg.name);
      if (msg.type === 'viseme') window.setVisemes(msg.data);
      if (msg.type === 'load_avatar') loadVRM(msg.path);
      if (msg.type === 'chat') addChatMessage('agent', msg.text);
    } catch(e) {}
  };
}

// Try connecting
try { connectWS(); } catch(e) { wsStatus.textContent = 'WS unavailable'; }

// ═══════════════════════════════════════════════════════════════
//  Chat Interface
// ═══════════════════════════════════════════════════════════════

function addChatMessage(role, text) {
  const messages = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

window.sendChat = function() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  addChatMessage('user', text);
  input.value = '';

  // Send via WebSocket if connected
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'chat', text }));
  }
};

// ═══════════════════════════════════════════════════════════════
//  UI Controls
// ═══════════════════════════════════════════════════════════════

window.toggleExpressions = function() {
  const panel = document.getElementById('expression-panel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
};

window.loadFromVRoidHub = function() {
  window.open('https://hub.vroid.com/characters?sort=popular', '_blank');
};

// Load VRM from URL parameter
const params = new URLSearchParams(location.search);
const vrmUrl = params.get('avatar');
if (vrmUrl) loadVRM(vrmUrl);

</script>
</body>
</html>
