name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: windows
            artifact_name: windows-installer
          - platform: linux
            artifact_name: linux-appimage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Shadow Agent v__VERSION__'
          releaseBody: |
            ## Download Shadow Agent

            ### Windows
            - NSIS Installer (Recommended): Shadow_Agent_Setup.exe
            - MSI Package: Shadow_Agent.msi

            ### Installation
            1. Download the installer for your platform
            2. Run the installer
            3. Launch Shadow Agent!

            ## What's New
            See [CHANGELOG.md](https://github.com/DEVGD-glitch/GenericAgent_Shadow/blob/main/CHANGELOG.md) for all updates.
          releaseDraft: true
          prerelease: false

# =============================================================================
# CI: Lint & Type Check
# =============================================================================
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Run ESLint
        run: bun run lint
      
      - name: Type check
        run: bun run type-check || true

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install ruff black
          cd upload/GenericAgent-v1.0.0
          pip install -r requirements.txt || true
      
      - name: Run Ruff
        run: ruff check upload/GenericAgent-v1.0.0/ || true
      
      - name: Run Black
        run: black --check upload/GenericAgent-v1.0.0/ || true

# =============================================================================
# Dev: Build Preview
# =============================================================================
name: Dev Build Preview

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  preview-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri
        if: github.event.inputs.build_type == 'release'
        run: bun run tauri build --debug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-agent-preview-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
